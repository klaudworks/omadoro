name: Model checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/model.test.cjs
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: python -m py_compile adapters/*.py scripts/*.py
      # Omarchy validation, QML runtime, and compositor tests require the target desktop.
